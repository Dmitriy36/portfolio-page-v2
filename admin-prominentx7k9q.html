<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Visit Log</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #008080;
        font-family: "Lucida Console", "Courier New", monospace;
        font-size: 13px;
        color: #000;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
        min-height: 100vh;
      }

      .window {
        background: #c0c0c0;
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        width: 100%;
        max-width: 1000px;
      }

      .title-bar {
        background: linear-gradient(to right, #000080, #1084d0);
        color: white;
        padding: 4px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
        font-size: 12px;
      }

      .title-bar-buttons {
        display: flex;
        gap: 2px;
      }

      .title-bar-btn {
        background: #c0c0c0;
        border-top: 1px solid #fff;
        border-left: 1px solid #fff;
        border-right: 1px solid #808080;
        border-bottom: 1px solid #808080;
        width: 16px;
        height: 14px;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .menu-bar {
        background: #c0c0c0;
        padding: 2px 4px;
        border-bottom: 1px solid #808080;
        font-size: 12px;
      }

      .content {
        padding: 12px;
      }

      .stats-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .stat-box {
        background: #c0c0c0;
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        padding: 8px 16px;
        flex: 1;
        text-align: center;
      }

      .stat-box .number {
        font-size: 24px;
        font-weight: bold;
        color: #000080;
        font-family: "Lucida Console", monospace;
      }

      .stat-box .label {
        font-size: 11px;
        color: #444;
      }

      .table-container {
        background: #fff;
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        overflow-x: auto;
        max-height: 500px;
        overflow-y: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      thead {
        position: sticky;
        top: 0;
      }

      th {
        background: #000080;
        color: white;
        padding: 4px 8px;
        text-align: left;
        font-weight: bold;
        white-space: nowrap;
      }

      td {
        padding: 3px 8px;
        border-bottom: 1px solid #e0e0e0;
        white-space: nowrap;
      }

      tr:nth-child(even) {
        background: #f0f0f0;
      }

      tr:hover {
        background: #000080;
        color: white;
      }

      .page-badge {
        background: #c0c0c0;
        border-top: 1px solid #fff;
        border-left: 1px solid #fff;
        border-right: 1px solid #808080;
        border-bottom: 1px solid #808080;
        padding: 1px 6px;
        font-size: 11px;
        display: inline-block;
      }

      .status-bar {
        background: #c0c0c0;
        border-top: 1px solid #808080;
        padding: 3px 8px;
        font-size: 11px;
        display: flex;
        gap: 16px;
      }

      .status-panel {
        border-top: 1px solid #808080;
        border-left: 1px solid #808080;
        border-right: 1px solid #fff;
        border-bottom: 1px solid #fff;
        padding: 1px 8px;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #000080;
        font-weight: bold;
      }

      .refresh-btn {
        background: #c0c0c0;
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        padding: 4px 16px;
        cursor: pointer;
        font-family: "Lucida Console", monospace;
        font-size: 12px;
        margin-bottom: 10px;
      }

      .refresh-btn:active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="title-bar">
        <span>📊 Portfolio Visit Log</span>
        <div class="title-bar-buttons">
          <div class="title-bar-btn">_</div>
          <div class="title-bar-btn">□</div>
          <div class="title-bar-btn">✕</div>
        </div>
      </div>

      <div class="menu-bar">File &nbsp; View &nbsp; Help</div>

      <div class="content">
        <div class="stats-row" id="stats-row">
          <div class="stat-box">
            <div class="number" id="total-visits">—</div>
            <div class="label">Total Visits</div>
          </div>
          <div class="stat-box">
            <div class="number" id="unique-ips">—</div>
            <div class="label">Unique IPs</div>
          </div>
          <div class="stat-box">
            <div class="number" id="pages-tracked">—</div>
            <div class="label">Pages Tracked</div>
          </div>
          <div class="stat-box">
            <div class="number" id="today-visits">—</div>
            <div class="label">Today</div>
          </div>
        </div>

        <button class="refresh-btn" onclick="loadVisits()">⟳ Refresh</button>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Page</th>
                <th>Timestamp</th>
                <th>IP Address</th>
                <th>Location</th>
              </tr>
            </thead>
            <tbody id="visits-tbody">
              <tr>
                <td colspan="5" class="loading">Loading visits...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="status-bar">
        <div class="status-panel" id="status-text">Ready</div>
        <div class="status-panel" id="last-updated">Not loaded</div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://ewztgzyqrgvhgmbaldgn.supabase.co";
      const SUPABASE_KEY = "sb_publishable_7vr3dnvPPCn4JKMUQVrTYw_1DDR0lX9";

      function formatTimestamp(ts) {
        const d = new Date(ts);
        return d.toLocaleString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }

      async function loadVisits() {
        document.getElementById("status-text").textContent = "Loading...";
        document.getElementById("visits-tbody").innerHTML =
          '<tr><td colspan="5" class="loading">Fetching data...</td></tr>';

        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/portfolio_visits?order=created_at.desc&limit=200`,
            {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
              },
            },
          );

          const visits = await res.json();

          // Stats
          const total = visits.length;
          const uniqueIPs = new Set(
            visits.map((v) => v.visitor_ip).filter(Boolean),
          ).size;
          const uniquePages = new Set(visits.map((v) => v.page)).size;
          const today = new Date().toDateString();
          const todayCount = visits.filter(
            (v) => new Date(v.created_at).toDateString() === today,
          ).length;

          document.getElementById("total-visits").textContent = total;
          document.getElementById("unique-ips").textContent = uniqueIPs;
          document.getElementById("pages-tracked").textContent = uniquePages;
          document.getElementById("today-visits").textContent = todayCount;

          // Table
          const tbody = document.getElementById("visits-tbody");
          tbody.innerHTML = "";

          for (let i = 0; i < visits.length; i++) {
            const v = visits[i];
            const tr = document.createElement("tr");
            tr.innerHTML = `
          <td>${i + 1}</td>
          <td><span class="page-badge">${v.page || "—"}</span></td>
          <td>${formatTimestamp(v.created_at)}</td>
          <td>${v.visitor_ip || "—"}</td>
          <td>${v.location || "—"}</td>
        `;
            tbody.appendChild(tr);
          }

          document.getElementById("status-text").textContent =
            `${total} records loaded`;
          document.getElementById("last-updated").textContent =
            "Updated: " + new Date().toLocaleTimeString();
        } catch (err) {
          document.getElementById("visits-tbody").innerHTML =
            `<tr><td colspan="5" class="loading">Error: ${err.message}</td></tr>`;
          document.getElementById("status-text").textContent =
            "Error loading data";
        }
      }

      loadVisits();
    </script>
  </body>
</html>
